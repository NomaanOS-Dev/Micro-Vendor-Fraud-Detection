services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vendor_fraud
      POSTGRES_USER: fraud_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_app -d vendor_fraud"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app

  fraud-engine:
    build:
      context: ./fraud-engine
    restart: unless-stopped
    env_file:
      - ./fraud-engine/.env.production
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    volumes:
      - evidence_data:/app/uploads
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      fraud-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - app

  migrate:
    build:
      context: ./backend
      target: migrator
    env_file:
      - ./backend/.env.production
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - ops
    networks:
      - app

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env.production}
    restart: unless-stopped
    expose:
      - "3001"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - app

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - app

  certbot:
    image: certbot/certbot
    profiles:
      - certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt

volumes:
  postgres_prod_data:
  evidence_data:
  certbot_www:
  certbot_conf:

networks:
  app:
    driver: bridge
